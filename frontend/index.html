<html lang="en">

    />

    <!-- Primary Meta Tags -->
    <title>Naturanza Food - Premium Organic & Natural Products | Buy Online in Pakistan</title>
    <meta name="title" content="Naturanza Food - Premium Organic & Natural Products | Buy Online in Pakistan" data-rh="true" />

    <meta name="keywords" content="organic food Pakistan, natural products, organic honey, ispaghol husk, organic spices, pure haldi, red chili powder, lal mirch, almond honey, sandal honey, wellness products, buy organic online Pakistan, Karachi Lahore Islamabad" data-rh="true" />
    <meta name="author" content="Naturanza Food" data-rh="true" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" data-rh="true" />
    <meta name="googlebot" content="index, follow, max-image-preview:large" data-rh="true" />
    <meta name="language" content="English" data-rh="true" />
    <meta name="revisit-after" content="7 days" data-rh="true" />

    <meta name="theme-color" content="#22c55e" data-rh="true" />

    <!-- Favicon (square icons only — the wide logo.png was being stretched by Google/browsers) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/images/icon-192.png" sizes="192x192" />
    <link rel="icon" type="image/png" href="/images/icon-512.png" sizes="512x512" />
    <link rel="apple-touch-icon" sizes="192x192" href="/images/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Canonical (replaced per-route by the server-side meta renderer and react-helmet-async) -->
    <link rel="canonical" href="https://naturanzafood.com/" data-rh="true" />

    <!-- Hreflang for Internationalization -->
    <link rel="alternate" hreflang="en-pk" href="https://naturanzafood.com/" data-rh="true" />
    <link rel="alternate" hreflang="x-default" href="https://naturanzafood.com/" data-rh="true" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" data-rh="true" />
    <meta property="og:url" content="https://naturanzafood.com/" data-rh="true" />
    <meta property="og:title" content="Naturanza Food - Premium Organic & Natural Products in Pakistan" data-rh="true" />
    <meta property="og:description" content="Shop pure organic honey, ispaghol husk, organic spices, and natural wellness products. 100% natural, sustainably sourced. Free shipping on prepaid online orders over Rs. 5,000 across Pakistan." data-rh="true" />
    <!--
      No og:image:width/height here. They are static, but og:image is swapped
      per-route by the server meta renderer, so the declared 1200x630 was a lie
      for every product image (product 5's file is 553x799). Scrapers read the
      real dimensions off the file when the hint is absent; a wrong hint they
      trust and crop against.
    -->
    <meta property="og:image" content="https://naturanzafood.com/images/og-image.jpg" data-rh="true" />
    <meta property="og:image:alt" content="Naturanza Food - Premium Organic & Natural Products" data-rh="true" />
    <meta property="og:site_name" content="Naturanza Food" data-rh="true" />
    <meta property="og:locale" content="en_PK" data-rh="true" />
    <meta property="og:locale:alternate" content="ur_PK" data-rh="true" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" data-rh="true" />
    <meta property="twitter:url" content="https://naturanzafood.com/" data-rh="true" />
    <meta property="twitter:title" content="Naturanza Food - Premium Organic & Natural Products" data-rh="true" />
    <meta property="twitter:description" content="Shop pure organic honey, ispaghol husk, organic spices, and natural wellness products. 100% natural, sustainably sourced." data-rh="true" />
    <meta property="twitter:image" content="https://naturanzafood.com/images/og-image.jpg" data-rh="true" />
    <meta property="twitter:image:alt" content="Naturanza Food - Premium Organic & Natural Products" data-rh="true" />

    <!-- DNS Prefetch for external resources -->
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical assets -->
    <link rel="preload" href="/images/logo.png" as="image" />

      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Naturanza Food",
      "legalName": "Naturanza Foods",

      "telephone": "+923409502646",

      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Nizam Pura",
        "addressLocality": "Chunian, District Kasur",
        "addressRegion": "Punjab",
        "addressCountry": "PK"
      },
      "sameAs": [
        "https://www.facebook.com/share/18x8ZMDq2H/",

      ],

      },

    <!-- Structured Data - WebSite with Search Action -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Naturanza Food",
      "url": "https://naturanzafood.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://naturanzafood.com/shop?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

</html>
